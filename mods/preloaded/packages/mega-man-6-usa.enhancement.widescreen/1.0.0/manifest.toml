[[option.choice]]
value = "fit"
label = "Fit to screen"
[[option.choice]]
value = "stock"
label = "Original"
[[option.choice]]
value = "16-9"
label = "16:9"
[[option.choice]]
value = "21-9"
label = "21:9"
[[option.choice]]
value = "32-9"
label = "32:9"
