format_version = 1
id = "mega-man-6-usa.coop"
version = "1.0.0"
name = "Co-op"
author = "NESRecomp"
description = "Mega Man and Proto Man play together with personal health, equipment and native inventories."
license = "PolyForm-Noncommercial-1.0.0"
resolver = "declarative"
save_compatibility = "requires-same-mods"

[[target]]
game_id = "mega-man-6-usa"
rom_crc32 = "988798a8"

[[feature]]
id = "coop"
name = "Co-op"
group = "Gameplay"
description = "Assign each player's controls in Controls. Native charge, slide and adapters remain available to both characters."
default_enabled = false
experimental = true
requires = ["mega-man-6-usa.character.protoman/protoman"]

[[plugin]]
feature = "coop"
id = "mm6.coop"

[[option]]
feature = "coop"
id = "coop-view"
label = "Two-player view"
type = "choice"
default = "shared"
[[option.choice]]
value = "shared"
label = "Shared screen"
[[option.choice]]
value = "split"
label = "Independent split screen"
[[option.choice]]
value = "p1"
label = "Independent: player one"
[[option.choice]]
value = "p2"
label = "Independent: player two"

[[option]]
feature = "coop"
id = "player-one"
label = "Player one character"
type = "choice"
default = "megaman"
[[option.choice]]
value = "megaman"
label = "Mega Man"
[[option.choice]]
value = "protoman"
label = "Proto Man"

[[option]]
feature = "coop"
id = "online-input"
label = "Online controls"
description = "Choose your local controls before joining a match. The default follows your occupied room seat."
type = "choice"
default = "seat"
[[option.choice]]
value = "seat"
label = "My seat's bindings"
[[option.choice]]
value = "device1"
label = "Player 1 bindings"
[[option.choice]]
value = "device2"
label = "Player 2 bindings"

[[option]]
feature = "coop"
id = "wait-for-both"
label = "Room transitions"
type = "choice"
default = "either"
[[option.choice]]
value = "either"
label = "Either player can lead"
[[option.choice]]
value = "both"
label = "Wait for both players"
